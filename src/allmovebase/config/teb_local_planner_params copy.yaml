TebLocalPlannerROS:
###
# 允许规划器优化Y方向的速度，不限于只沿X轴移动
  y_vel_mode: false
  # 允许规划器在必要时向后移动
  forward_driving: false
##
# 在Rviz中显示TEB规划的轨迹
  # publish_feedback: true
   # Robot
  max_vel_x: 1.5
  max_vel_x_backwards: 0.4
  max_vel_y: 1.5
  max_vel_trans: 1.0
  max_vel_theta: 1.0
  acc_lim_x: 1.2
  acc_lim_y: 1.2
  acc_lim_theta: 2.0
  min_turning_radius: 0.0
  wheelbase: 0.0  # only for cmd_angle_instead_rotvel enabled car-like robot  
  cmd_angle_instead_rotvel: false
  is_footprint_dynamic: false
  use_proportional_saturation: true
  transform_tolerance: 0.3
  footprint_model:
    type: polygon
    vertices: [[-0.25, -0.15], [-0.25, 0.15], [0.25, 0.15], [0.25, -0.15]]

  # GoalTolerance
  xy_goal_tolerance: 0.10 # 0.2
  yaw_goal_tolerance: 0.1 # 0.2
  free_goal_vel: false
  trans_stopped_vel: 0.05
  theta_stopped_vel: 0.05
  complete_global_plan: false

  # 优化器配置 (Optimizer Configuration)
  # 轨迹优化次数
  optimization_activate: true
  optimization_iterations: 25

  # 规划器配置 (Planner Configuration)
  holonomic_robot: true     # 启用全向模式，这是全向机器人最关键的参数
  trajectory_point_distance: 0.1 # 轨迹点之间的距离
  dt_ref: 0.15              # 轨迹点之间的时间间隔参考
  dt_hysteresis: 0.1       # 时间间隔的滞后

  # 避障配置 (Obstacle Configuration)
  obstacle_cost_scale: 1.0    # 障碍物成本权重
  inflation_dist: 0.1         # 障碍物膨胀距离
  include_costmap_obstacles: true
  min_obstacle_dist: 0.2      # 机器人与障碍物之间的最小安全距离

  # 动态障碍物配置
  include_dynamic_obstacles: false # 如果没有动态障碍物，设为false可以提高效率
  
  teb_autosize: true          # 根据机器人速度自动调整轨迹长度